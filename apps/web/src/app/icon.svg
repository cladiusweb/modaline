<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" fill="#0c0c0c" rx="20"/>
  <!-- ModaLine Interlocking M & L Monogram in Pure White -->
  <g fill="none" stroke="#FAF9F6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left M Leg -->
    <line x1="26" y1="28" x2="26" y2="72"/>
    <line x1="33" y1="28" x2="33" y2="72"/>
    <!-- Diagonal M Peak -->
    <polyline points="33,30 50,56 67,30"/>
    <!-- Right M Leg -->
    <line x1="67" y1="28" x2="67" y2="72"/>
    <line x1="74" y1="28" x2="74" y2="72"/>
    <!-- Elegant Couturier Line / L loop accent -->
    <path d="M 44,72 C 44,60 50,48 58,48 C 66,48 66,58 58,68 L 74,68" stroke-width="5"/>
  </g>
</svg>
